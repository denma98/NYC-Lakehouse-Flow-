[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-mobility-lakehouse"
version = "1.0.0"
description = "Medallion (Bronze/Silver/Gold) lakehouse for NYC taxi + weather data using DuckDB"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1",
    "requests>=2.31",
    "pandas>=2.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.45"]
dev = ["pytest>=8.0"]

[project.scripts]
lakehouse = "lakehouse.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
